<!DOCTYPE html>
<html>
<head>
    <title>CSS Basic</title>

    <style>

        h1 {
            color: blue;
            text-align: center;
        }

        p {
            color: green;
            font-size: 20px;
            font-family: Arial;
        }

        .box {
            background-color: lightyellow;
            padding: 15px;
        }

    </style>
</head>

<body>

    <h1>Welcome to CSS</h1>

    <p>This is an example of CSS styling.</p>

    <div class="box">
        CSS makes webpages attractive.
    </div>

</body>
</html>
