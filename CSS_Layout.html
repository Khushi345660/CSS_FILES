<!DOCTYPE html>
<html>
<head>
    <title>CSS Layout</title>

    <style>

        header {
            background-color: navy;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: lightgray;
            padding: 15px;
        }

        main {
            background-color: lightyellow;
            padding: 30px;
            min-height: 150px;
        }

        footer {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 10px;
        }

    </style>
</head>

<body>

    <header>
        <h1>My Website</h1>
    </header>

    <nav>
        Home | About | Contact
    </nav>

    <main>
        <h2>Welcome</h2>
        <p>This is my webpage layout.</p>
    </main>

    <footer>
        Copyright 2026
    </footer>

</body>
</html>
