<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Example</title>

    <style>

        .container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: lightgray;
            padding: 20px;
        }

        .box {
            background-color: skyblue;
            padding: 30px;
            margin: 10px;
            text-align: center;
        }

    </style>
</head>

<body>

    <h1>CSS Flexbox</h1>

    <div class="container">

        <div class="box">Box 1</div>

        <div class="box">Box 2</div>

        <div class="box">Box 3</div>

    </div>

</body>
</html>
